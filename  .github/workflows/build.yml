name: Build MEA EXE

on:
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой

jobs:
  build:
    runs-on: windows-latest # Сервер GitHub с Windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install colorama crccheck pltable pyinstaller

      - name: Compile to EXE
        run: pyinstaller --onefile MEA.py

      - name: Save EXE
        uses: actions/upload-artifact@v4
        with:
          name: MEA-Windows-EXE
          path: dist/MEA.exe
